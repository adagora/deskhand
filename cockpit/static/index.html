<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Deskhand</title>
<link rel="stylesheet" href="/cockpit.css">
</head>
<body class="signed-out">
<a class="skip" href="#main">Skip to the content</a>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="logo" aria-hidden="true"></span><div><strong>Deskhand</strong><small>cockpit</small></div></div>
    <nav id="nav" aria-label="Sections"></nav>
    <nav id="tools-nav" class="related" aria-label="Related tools" hidden></nav>
    <div class="side-foot">
      <div class="who" id="who"></div>
      <button class="link-btn" id="theme" type="button"></button>
      <button class="link-btn" id="signout" type="button">Sign out</button>
    </div>
  </aside>
  <main id="main" class="main" tabindex="-1">
    <header class="head">
      <div><h1 id="title">Sign in</h1><p id="subtitle"></p></div>
      <div class="tools" id="tools" hidden>
        <label class="check"><input type="checkbox" id="auto" checked><span>Refresh every 15 s</span></label>
        <button class="btn" id="refresh" type="button">Refresh</button>
      </div>
    </header>
    <div id="alert" role="alert" class="alert" hidden></div>
    <section id="page" aria-live="polite"></section>
  </main>
</div>
<script src="/cockpit.js"></script>
</body>
</html>
